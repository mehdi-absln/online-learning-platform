name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The Nuxt test environment boots the app, so the runtime config has to
      # resolve. These are throwaway values for CI only — no real database is
      # reached: the service tests run against an in-memory SQLite instance.
      JWT_SECRET: ci-not-a-real-secret-value-for-tests-only
      NUXT_JWT_SECRET: ci-not-a-real-secret-value-for-tests-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `postinstall` runs `nuxt prepare`, which generates .nuxt/ — the Nuxt
      # test environment needs it, so nothing extra is required here.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      # `npm test` is vitest in watch mode and would hang a runner; the suite
      # is `test:run`. vitest.config.ts pins a single thread on purpose, so
      # this is slower than it looks but will not OOM the runner.
      - name: Test
        run: npm run test:run
